# nginx do frontend. Duas funcoes:
#
#   1. servir a SPA, com fallback para o index.html: F5 em /esqueci-senha precisa devolver o
#      app, e quem resolve a rota e o react-router no navegador;
#   2. ser o proxy de /api para a API, sem o prefixo, como o proxy do Vite em dev.
#
# O navegador so fala com esta origem. Por isso nao ha CORS e o cookie de sessao (crm_session,
# SameSite=Lax) e o do CSRF (XSRF-TOKEN) viajam no mesmo site (architecture.md §14).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o upstream numa variavel, o nome "backend" e resolvido a cada
    # requisicao: o nginx sobe mesmo com a API fora do ar (responde 502 ate ela voltar) e
    # acompanha a API quando o conteiner dela e recriado com outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API -----------------------------------------------------------------
    location /api/ {
        set $api http://backend:8080;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A API usa o IP do cliente no limite de login por origem (server.forward-headers-strategy
        # =native): o Tomcat so confia no X-Forwarded-For de proxy da rede privada, e a rede do
        # Docker entra na lista padrao dele.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- arquivos com hash no nome: cache longo ------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- SPA -----------------------------------------------------------------
    # O index.html nunca e cacheado: e ele que aponta para os assets do deploy atual.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
