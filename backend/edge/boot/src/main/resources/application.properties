# ATENCAO: arquivos .properties sao lidos como ISO-8859-1 (especificacao do java.util.Properties),
# nao como UTF-8. Comentario com acento vira lixo na leitura. Por isso todo texto aqui e sem
# acento, de proposito -- nao "corrija" reacentuando.
#
# Este arquivo carrega so o que NAO muda entre ambientes. O que varia por ambiente vive em
# application-<perfil>.properties, que sobrescreve o que estiver aqui.

spring.application.name=crm

# Perfil padrao e dev, por conveniencia de quem desenvolve.
# ATENCAO EM PRODUCAO: o deploy PRECISA definir SPRING_PROFILES_ACTIVE=prod. Sem isso a
# aplicacao sobe em dev, aponta para localhost e publica a documentacao da API (architecture.md 12).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Flyway ------------------------------------------------------------------
# A instancia automatica fica DESLIGADA de proposito: cada modulo dono de schema tera o seu
# proprio Flyway, com location e tabela de historico proprias, quando as migrations existirem.
spring.flyway.enabled=false

# --- JPA ---------------------------------------------------------------------
# As migrations sao a fonte de verdade do schema: o Hibernate so valida, nunca gera DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- IP do cliente atras do proxy ---------------------------------------------
server.forward-headers-strategy=native

# --- Actuator ----------------------------------------------------------------
# So o health, publico e sem detalhes, para o deploy e o Docker.
management.endpoints.web.exposure.include=health

# --- Documentacao da API (springdoc) -----------------------------------------
# Desligada aqui, e prod nao liga: em producao, a documentacao da API e informacao para quem
# ataca. So o perfil dev liga.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- IAM (feature 01-iam) ----------------------------------------------------
# Todas tem default no codigo (IamProperties); os valores abaixo sao os da spec. Descomente so
# para mudar.
#crm.iam.session-validity=30d
#crm.iam.session-renew-interval=5m
#crm.iam.session-cache-ttl=60s
#crm.iam.invitation-validity=48h
#crm.iam.password-reset-validity=1h
#crm.iam.login-limit-per-email.max-attempts=5
#crm.iam.login-limit-per-email.window=15m
#crm.iam.login-limit-per-origin.max-attempts=20
#crm.iam.login-limit-per-origin.window=15m
#crm.iam.password-reset-limit-per-email.max-attempts=3
#crm.iam.password-reset-limit-per-email.window=1h
#
# Endereco do frontend, base dos links de convite e de redefinicao enviados por e-mail.
# OBRIGATORIO EM PRODUCAO: o default e o endereco de desenvolvimento, e sem esta propriedade os
# e-mails saem com links apontando para localhost, sem erro nenhum.
#crm.iam.app-url=http://localhost:5173
#
# Custo do Argon2id. Os defaults sao o minimo da OWASP. Os valores de producao precisam ser
# MEDIDOS na VPS-alvo, para cada hash levar entre 200 e 500 ms; a medida ainda nao foi feita.
#crm.iam.argon2.memory-kib=19456
#crm.iam.argon2.iterations=2
#crm.iam.argon2.parallelism=1
#crm.iam.argon2.salt-length=16
#crm.iam.argon2.hash-length=32
#
# Administrador inicial: variaveis de ambiente OBRIGATORIAS, sem default, lidas pelo seeder so
# quando o banco nao tem nenhum usuario (a falta de uma derruba o boot):
#   CRM_ADMIN_NAME, CRM_ADMIN_EMAIL, CRM_ADMIN_PASSWORD
# A senha segue a regra de senha (8 a 30 caracteres, maiuscula, minuscula, numero e especial),
# nao pode conter "${" (seria lida como outra variavel) e e trocada no primeiro acesso.
# Descarte as variaveis depois do primeiro boot.
