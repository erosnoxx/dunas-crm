# ATENCAO: arquivos .properties sao lidos como ISO-8859-1 (especificacao do java.util.Properties),
# nao como UTF-8. Comentario com acento vira lixo na leitura. Por isso todo texto aqui e sem
# acento, de proposito -- nao "corrija" reacentuando.
#
# Este arquivo carrega so o que NAO muda entre ambientes. O que varia por ambiente vive em
# application-<perfil>.properties, que sobrescreve o que estiver aqui.

spring.application.name=crm

# Perfil padrao e dev, por conveniencia de quem desenvolve.
# ATENCAO EM PRODUCAO: o deploy PRECISA definir SPRING_PROFILES_ACTIVE=prod. Sem isso a
# aplicacao sobe em dev e aponta para localhost.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Flyway ------------------------------------------------------------------
# A instancia automatica fica DESLIGADA de proposito: cada modulo dono de schema tera o seu
# proprio Flyway, com location e tabela de historico proprias, quando as migrations existirem.
spring.flyway.enabled=false

# --- JPA ---------------------------------------------------------------------
# As migrations sao a fonte de verdade do schema: o Hibernate so valida, nunca gera DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- IP do cliente atras do proxy ---------------------------------------------
server.forward-headers-strategy=native

# --- Actuator ----------------------------------------------------------------
# So o health, publico e sem detalhes, para o deploy e o Docker.
management.endpoints.web.exposure.include=health

# --- Documentacao da API (springdoc) -----------------------------------------
# Desligada aqui, e prod nao liga: em producao, a documentacao da API e informacao para quem
# ataca. So o perfil dev liga.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
