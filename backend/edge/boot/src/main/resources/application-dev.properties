# Perfil de desenvolvimento local. Texto sem acento de proposito -- ver o topo de
# application.properties.
#
# Aqui tudo tem default de localhost: o objetivo e que "subir o stack e rodar" funcione sem
# ninguem precisar exportar variavel nenhuma. A variavel de ambiente continua vencendo o
# default, para quem apontar para outro host.

# --- Banco -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_URL:localhost:5432/crm}
spring.datasource.username=${DB_USER:crm}
spring.datasource.password=${DB_PASSWORD:crm}

# --- Observabilidade de desenvolvimento --------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.crm=DEBUG

# --- Documentacao da API -----------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
