<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novo equipamento, celular, com erro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1220;color:#E8EDF5;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:24px}
h1,h2,p{margin:0}
.phone{width:390px;height:844px;display:flex;flex-direction:column;background:#0B1220;overflow:hidden}
.top{height:64px;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 8px;background:#0F1729;border-bottom:1px solid #26324A;flex-shrink:0}
.bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#E8EDF5;text-decoration:none}
.ttl{flex:1;font-family:"Chakra Petch",system-ui,sans-serif;font-size:24px;line-height:28px;font-weight:600}
.body{flex:1;min-height:0;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label,.fl .lb{font-size:13px;line-height:18px;font-weight:600}
.in{height:48px;box-sizing:border-box;width:100%;background:#131C2E;border:1px solid #34476B;color:#E8EDF5;padding:0 12px;font:inherit;font-size:16px}
.in.err{border:2px solid #FF6B6B;padding:0 11px}
.ro{min-height:48px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;background:#0F1729;border:1px solid #26324A;color:#9AA7BD;font-size:16px}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:20px;color:#FFA3A3}
.msg svg{flex-shrink:0;margin-top:2px;color:#FF6B6B}
.help{font-size:12px;line-height:16px;color:#9AA7BD}
.act{padding:12px 16px;background:#0F1729;border-top:1px solid #26324A;flex-shrink:0}
.btn{height:48px;width:100%;border:0;background:#FF7E00;color:#0B1220;font:600 16px "IBM Plex Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-decoration:none;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
</style>
</helmet>
<div class="phone">
  <header class="top">
    <a class="bk" href="Ficha-celular.dc.html" aria-label="Voltar para a ficha do cliente">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="ttl">Novo equipamento</h1>
  </header>

  <form class="body" action="#">
    <div class="fl">
      <span class="lb">Local</span>
      <div class="ro">Loja Centro · Uberlândia/MG</div>
    </div>
    <div class="fl">
      <label for="mod">Modelo *</label>
      <select id="mod" class="in" aria-describedby="mod-dica">
        <option>S5-GR3P15K · Solis · Inversor · 15 kW</option>
        <option selected>S6-GR1P5K · Solis · Inversor · 5 kW</option>
        <option>SUN2000-5KTL-L1 · Huawei · Inversor · 5 kW</option>
      </select>
      <p id="mod-dica" class="help">Só modelos ativos do catálogo.</p>
    </div>
    <div class="fl">
      <label for="ser">Número de série *</label>
      <input id="ser" class="in err" type="text" maxlength="60" value="1031050223290123" aria-invalid="true" aria-describedby="ser-erro">
      <p id="ser-erro" class="msg">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.5"/></svg>
        Este modelo já tem um equipamento com esse número de série. Confira a etiqueta ou busque a série na lista de clientes.
      </p>
    </div>
    <div class="fl">
      <label for="dt">Data de instalação (opcional)</label>
      <input id="dt" class="in err" type="date" value="2026-12-02" max="2026-11-22" aria-invalid="true" aria-describedby="dt-erro">
      <p id="dt-erro" class="msg">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.5"/></svg>
        A data de instalação não pode ser depois de hoje.
      </p>
    </div>
  </form>

  <div class="act"><a class="btn" href="#">Salvar equipamento</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
