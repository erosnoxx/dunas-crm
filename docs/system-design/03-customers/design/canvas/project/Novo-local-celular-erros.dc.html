<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novo local, celular, com erro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1220;color:#E8EDF5;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:24px}
h1,h2,p{margin:0}
.phone{width:390px;height:844px;display:flex;flex-direction:column;background:#0B1220;overflow:hidden}
.top{height:64px;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 8px;background:#0F1729;border-bottom:1px solid #26324A;flex-shrink:0}
.bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#E8EDF5;text-decoration:none}
.ttl{flex:1;font-family:"Chakra Petch",system-ui,sans-serif;font-size:24px;line-height:28px;font-weight:600}
.body{flex:1;min-height:0;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.ctx{font-size:14px;line-height:20px;color:#9AA7BD}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl label{font-size:13px;line-height:18px;font-weight:600}
.in{height:48px;box-sizing:border-box;width:100%;background:#131C2E;border:1px solid #34476B;color:#E8EDF5;padding:0 12px;font:inherit;font-size:16px}
.in.err{border:2px solid #FF6B6B;padding:0 11px}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:20px;color:#FFA3A3}
.msg svg{flex-shrink:0;margin-top:2px;color:#FF6B6B}
.sec{border-top:1px solid #26324A;padding-top:16px;display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:13px;line-height:18px;font-weight:600;color:#9AA7BD}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cu{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px}
.act{padding:12px 16px;background:#0F1729;border-top:1px solid #26324A;flex-shrink:0}
.btn{height:48px;width:100%;border:0;background:#FF7E00;color:#0B1220;font:600 16px "IBM Plex Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-decoration:none;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
</style>
</helmet>
<div class="phone">
  <header class="top">
    <a class="bk" href="Ficha-celular-sem-locais.dc.html" aria-label="Voltar para a ficha do cliente">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="ttl">Novo local</h1>
  </header>

  <form class="body" action="#">
    <p class="ctx">Cliente: Ana Paula Ribeiro</p>
    <div class="fl">
      <label for="nome">Nome do local *</label>
      <input id="nome" class="in" type="text" maxlength="60" value="Casa">
    </div>
    <div class="sec">
      <h2>Endereço</h2>
      <div class="fl">
        <label for="cep">CEP *</label>
        <input id="cep" class="in err" type="text" inputmode="numeric" placeholder="00000-000" value="14025-2" aria-invalid="true" aria-describedby="cep-erro" style="width:160px">
        <p id="cep-erro" class="msg">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.5"/></svg>
          CEP incompleto: informe os 8 dígitos.
        </p>
      </div>
      <div class="fl">
        <label for="rua">Logradouro *</label>
        <input id="rua" class="in" type="text" maxlength="150" value="Rua Garibaldi">
      </div>
      <div class="two">
        <div class="fl">
          <label for="num">Número *</label>
          <input id="num" class="in" type="text" maxlength="15" value="1180">
        </div>
        <div class="fl">
          <label for="comp">Complemento</label>
          <input id="comp" class="in" type="text" maxlength="50" placeholder="Opcional">
        </div>
      </div>
      <div class="fl">
        <label for="bairro">Bairro *</label>
        <input id="bairro" class="in err" type="text" maxlength="100" aria-invalid="true" aria-describedby="bairro-erro">
        <p id="bairro-erro" class="msg">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.5"/></svg>
          Informe o bairro.
        </p>
      </div>
      <div class="cu">
        <div class="fl">
          <label for="cid">Cidade *</label>
          <input id="cid" class="in" type="text" maxlength="100" value="Ribeirão Preto">
        </div>
        <div class="fl">
          <label for="uf">UF *</label>
          <select id="uf" class="in"><option>AC</option><option>AL</option><option>AM</option><option>AP</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MG</option><option>MS</option><option>MT</option><option>PA</option><option>PB</option><option>PE</option><option>PI</option><option>PR</option><option>RJ</option><option>RN</option><option>RO</option><option>RR</option><option>RS</option><option>SC</option><option>SE</option><option selected>SP</option><option>TO</option></select>
        </div>
      </div>
    </div>
  </form>

  <div class="act"><a class="btn" href="#">Salvar local</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
