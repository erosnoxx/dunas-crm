.body{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #34476B;flex-shrink:0}

.chips{display:flex;gap:8px}

.empty h2{font-family:"Chakra Petch",system-ui,sans-serif;font-size:20px;line-height:24px;font-weight:600}
.empty p{font-size:14px;line-height:20px;color:#9AA7BD}
.lnk{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;color:#FF7E00;font-weight:600;font-size:14px;text-decoration:none}
.act{padding:12px 16px;background:#0B1220;flex-shrink:0}

.bnav{height:64px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#0F1729;border-top:1px solid #26324A;flex-shrink:0}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:16px;font-weight:600;color:#9AA7BD;text-decoration:none}

  </nav>
</div>
